name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Republish even when the Tereditor zips are already adopted
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REPO: CommanderTvis/tereditor

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.compare.outputs.sha }}
      x64: ${{ steps.compare.outputs.x64 }}
      arm64: ${{ steps.compare.outputs.arm64 }}
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh api "repos/$SOURCE_REPO/releases/tags/nightly")
          digest() {
            jq -r --arg name "tereditor-nightly-win-$1.zip" '.assets[] | select(.name == $name) | .digest | sub("^sha256:"; "")' <<< "$release"
          }
          x64=$(digest x64)
          arm64=$(digest arm64)
          for value in "$x64" "$arm64"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Invalid Tereditor asset digest'; exit 1; }
          done
          # One adopted marker covers both zips: the SHA256 of their digests in architecture order.
          sha=$(printf '%s\n' "$x64" "$arm64" | sha256sum | cut -d' ' -f1)
          last=$(bun scripts/publication.ts sha "$GITHUB_REPOSITORY")
          {
            echo "sha=$sha"
            echo "x64=$x64"
            echo "arm64=$arm64"
            if [ "$sha" != "$last" ] || [ "$FORCE" = true ]; then echo changed=true; else echo changed=false; fi
            echo "version=0.0.0-nightly.$(date -u +%Y%m%d%H%M%S)"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SOURCE_SHA: ${{ needs.check.outputs.sha }}
      X64_SHA256: ${{ needs.check.outputs.x64 }}
      ARM64_SHA256: ${{ needs.check.outputs.arm64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Mirror the Tereditor nightly into this immutable release
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for arch in x64 arm64; do
            gh release download nightly --repo "$SOURCE_REPO" \
              --pattern "tereditor-nightly-win-$arch.zip" --output "artifacts/tereditor-windows-$arch.zip"
            unzip -l "artifacts/tereditor-windows-$arch.zip" | grep -Eq 'client[/\\]tereditor\.exe$'
          done
          printf '%s  %s\n' "$X64_SHA256" tereditor-windows-x64.zip "$ARM64_SHA256" tereditor-windows-arm64.zip > artifacts/SHA256SUMS
          (cd artifacts && sha256sum --check SHA256SUMS)
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Generate candidate catalog
        run: |
          set -euo pipefail
          bun scripts/catalog.ts "$GITHUB_REPOSITORY" "$VERSION" artifacts artifacts/catalog.json
          echo "$SOURCE_SHA" > artifacts/source.sha
      - id: release
        name: Publish immutable downloads for installation checks
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$VERSION" --notes "Unsigned Tereditor nightly mirrored from the $SOURCE_REPO nightly release (x64 sha256 $X64_SHA256, ARM64 sha256 $ARM64_SHA256)."
          echo 'created=true' >> "$GITHUB_OUTPUT"
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            artifacts/tereditor-windows-x64.zip artifacts/tereditor-windows-arm64.zip artifacts/SHA256SUMS artifacts/catalog.json artifacts/source.sha
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate
          path: artifacts/catalog.json
          if-no-files-found: error

  validate:
    needs: [check, release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate
          path: artifacts
      - name: Verify Tereditor metadata through WinGet
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: ./scripts/test-install.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: install-logs
          path: |
            .smoke/*.log
            .smoke/*.err
          include-hidden-files: true
          if-no-files-found: ignore

  publish:
    needs: [check, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SOURCE_SHA: ${{ needs.check.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse publication from an outdated distribution checkout
        run: |
          set -euo pipefail
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$head" = "$GITHUB_SHA" ] || { echo '::error::main changed; rerun the nightly'; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate
          path: artifacts
      - run: bun install --frozen-lockfile
      - name: Prepare the verified catalog
        run: cp artifacts/catalog.json catalog.json
      - run: bun run check && bun run build
      - name: Deploy the verified catalog
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bun run deploy --token "$VERCEL_TOKEN"
      - name: Verify the public source before adoption
        run: bun scripts/verify-source.ts https://commandertvis-winget.vercel.app
      - name: Adopt the verified nightly in Releases
        run: bun scripts/publication.ts adopt "$GITHUB_REPOSITORY" "$VERSION" "$SOURCE_SHA"

  cleanup:
    needs: [check, release, validate, publish]
    if: always() && needs.release.outputs.created == 'true' && needs.validate.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Remove downloads never offered by the source
        run: gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
